<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área da Loja · Floripa iPhones</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#16243b;font:16px Outfit,Arial}header,main{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}a{color:#315ddb}h1{font-weight:500;margin:10px 0}section,form{background:white;border:1px solid #e1e7f1;border-radius:20px;padding:24px;margin:16px 0}label{display:block;margin:12px 0 5px}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #ccd5e5;border-radius:10px}input:not([type=checkbox]),select,textarea{width:100%}textarea{min-height:100px}button{cursor:pointer;background:#315ddb;color:white;border:0;margin:8px 8px 0 0}button:disabled{opacity:.5;cursor:wait}.muted{color:#68758b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid #eee}.row img{width:65px;height:70px;object-fit:contain}.row div{flex:1}#notice{white-space:pre-wrap}#login{max-width:440px;margin:30px auto}[hidden]{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}header,main{padding:16px}.row{flex-wrap:wrap}}
</style><header><strong>FLORIPA iPHONES<br><small class="muted">Área da Loja</small></strong><a href="./">Ver site ↗</a></header><main><h1>Seu showroom, em dia.</h1><p class="muted">Gerencie aparelhos, fotos e valores. As alterações salvas aparecem para os visitantes ao carregar o site.</p><p id="notice" role="status" aria-live="polite"></p>
<form id="login"><h2>Entrar na loja</h2><label for="username">Usuário</label><input id="username" autocomplete="username" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" required><button>Entrar</button></form>
<div id="panel" hidden><button id="add">+ Novo produto</button><button id="reload">Atualizar lista</button><button id="logout">Sair</button><section id="list"></section>
<form id="editor" hidden><h2 id="title">Produto</h2><div class="grid"><div><label for="name">Nome do aparelho</label><input id="name" required maxlength="100"></div><div><label for="price">Preço em R$ (vazio = sob consulta)</label><input id="price" type="number" min="0" max="1000000" step=".01"></div><div><label for="category">Categoria</label><select id="category"><option>iPhones</option><option>Linha Pro</option></select></div><div><label for="condition">Condição</label><select id="condition"><option>Sob consulta</option><option>Novo</option><option>Seminovo</option></select></div><div><label for="position">Ordem de exibição (menores primeiro)</label><input id="position" type="number" required step="1"></div><div><label for="storage">Capacidades, separadas por vírgula</label><input id="storage" placeholder="128 GB, 256 GB"></div></div>
<label for="description">Descrição</label><textarea id="description" maxlength="1200"></textarea><label for="tag">Destaque curto</label><input id="tag" maxlength="60">
<div class="grid"><div><label for="chip">Processador</label><input id="chip" maxlength="60"></div><div><label for="camera">Câmera</label><input id="camera" maxlength="80"></div></div><label for="screen">Tela</label><input id="screen" maxlength="80">
<label for="photos">Enviar novas fotos (a primeira será a principal)</label><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><p class="muted">Até 8 fotos, 5 MB cada. Novas fotos substituem a galeria deste produto ao salvar.</p><div id="preview"></div>
<label><input id="visible" type="checkbox"> Exibir no showroom</label><button id="save">Salvar produto</button><button type="button" id="cancel">Cancelar</button></form></div></main>
<script>
const URL='https://mcqibvfcbzermtbwwhtg.supabase.co',KEY='sb_publishable_K_3NYQ-1mh9HUSuE4PELFA_4V7LqU3w';let token='',rows=[],editing=null;
const el=id=>document.getElementById(id),say=t=>el('notice').textContent=t;
async function api(path,options={}){const r=await fetch(URL+path,{...options,headers:{apikey:KEY,...(token?{Authorization:'Bearer '+token}:{}),...options.headers}});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{data=raw}if(!r.ok){if(r.status===401){token='';el('panel').hidden=true;el('login').hidden=false;}throw Error(r.status===401?'Sessão expirada. Entre novamente.':data.msg||data.message||data.error_description||'Não foi possível salvar. Tente novamente.')}return data}
function img(src){return src.startsWith('/assets/')?'/floripa-iphones'+src:src}
async function refresh(){rows=await api('/rest/v1/products?select=*&order=position.asc,id.asc');el('list').replaceChildren();for(const row of rows){let line=document.createElement('div');line.className='row';let photo=document.createElement('img');photo.src=img(row.data.image);photo.alt=row.data.name;let info=document.createElement('div'),name=document.createElement('strong'),detail=document.createElement('p');name.textContent=row.data.name;detail.textContent=(row.data.price===null?'Sob consulta':Number(row.data.price).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}))+' · '+(row.visible?'Visível':'Oculto')+' · Ordem '+row.position;info.append(name,detail);let edit=document.createElement('button');edit.textContent='Editar';edit.onclick=()=>open(row);line.append(photo,info,edit);el('list').append(line)}if(!rows.length)el('list').textContent='Nenhum produto cadastrado.'}
function open(row){editing=row;const p=row?.data||{};el('editor').reset();for(const id of ['name','price','category','condition','description','tag','chip','camera','screen'])el(id).value=p[id]??(id==='category'?'iPhones':id==='condition'?'Sob consulta':'');el('storage').value=(p.storage||[]).join(', ');el('position').value=row?.position??rows.length;el('visible').checked=row?.visible??true;el('preview').replaceChildren();for(const src of p.images||[]){let image=document.createElement('img');image.src=img(src);image.style='height:90px;max-width:100px;object-fit:contain';image.alt='Foto atual';el('preview').append(image)}el('title').textContent=row?'Editar produto':'Novo produto';el('editor').hidden=false;el('editor').scrollIntoView({behavior:'smooth'})}
el('login').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;say('Entrando…');try{if(el('username').value.trim().toLowerCase()!=='usuario_admin')throw Error('Usuário ou senha incorretos.');const session=await api('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'usuario_admin@floripa-iphones.invalid',password:el('password').value})});token=session.access_token;el('password').value='';const admin=await api('/rest/v1/shop_admins?select=user_id');if(!admin.length){token='';throw Error('Conta sem acesso à loja.')}await refresh();el('login').hidden=true;el('panel').hidden=false;say('Bem-vindo à Área da Loja.')}catch(err){say(err.message)}finally{button.disabled=false}};
el('logout').onclick=async()=>{try{await api('/auth/v1/logout',{method:'POST'})}catch{}token='';rows=[];el('list').replaceChildren();el('panel').hidden=true;el('editor').hidden=true;el('login').hidden=false;say('Você saiu da conta.')};
el('add').onclick=()=>open(null);el('cancel').onclick=()=>el('editor').hidden=true;el('reload').onclick=()=>refresh().catch(e=>say(e.message));
el('editor').onsubmit=async e=>{e.preventDefault();el('save').disabled=true;say('Salvando…');try{const files=[...el('photos').files];if(files.length>8)throw Error('Selecione até 8 fotos.');for(const f of files)if(f.size>5242880||!['image/jpeg','image/png','image/webp'].includes(f.type))throw Error('Use JPG, PNG ou WebP de até 5 MB.');let images=editing?.data.images||[];if(files.length){images=[];for(const file of files){const path=crypto.randomUUID()+'.'+({'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type]);await api('/storage/v1/object/products/'+path,{method:'POST',headers:{'Content-Type':file.type},body:file});images.push(URL+'/storage/v1/object/public/products/'+path)}}if(!images.length)throw Error('Envie pelo menos uma foto.');const id=editing?.id||crypto.randomUUID();let data={...(editing?.data||{}),id,image:images[0],images,visible:el('visible').checked,storage:el('storage').value.split(',').map(s=>s.trim()).filter(Boolean),price:el('price').value===''?null:Number(el('price').value)};for(const key of ['name','category','condition','description','tag','chip','camera','screen'])data[key]=el(key).value.trim();data.colors=files.length||!editing?[{name:'Modelo',hex:'#ccd2da',image:images[0]}]:editing.data.colors;const body={id,data,visible:data.visible,position:Number(el('position').value)};await api('/rest/v1/products'+(editing?'?id=eq.'+encodeURIComponent(id):''),{method:editing?'PATCH':'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});await refresh();el('editor').hidden=true;say('Produto salvo. A alteração já está disponível no showroom.')}catch(err){say(err.message)}finally{el('save').disabled=false}};
</script></html>
